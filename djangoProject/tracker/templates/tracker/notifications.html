{% extends 'tracker/base.html' %}{% block content %}<div class="page-heading"><div><div class="eyebrow">INBOX</div><h1>站内通知</h1><p>及时接收需求流转与 Bug 处理动态。</p></div><form method="post" action="{% url 'notifications_read' %}">{% csrf_token %}<button class="button secondary">全部标记已读</button></form></div><section class="panel">{% for item in items %}<a class="record-row" href="{{ item.url }}"><span>{% if not item.read %}<span class="dot"></span>{% endif %} {{ item.text }}</span><small>{{ item.created_at|date:'Y-m-d H:i' }}</small></a>{% empty %}<div class="empty">暂无通知</div>{% endfor %}</section>{% endblock %}

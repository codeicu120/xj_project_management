{% extends 'tracker/base.html' %}{% block content %}<div class="page-heading"><div><div class="eyebrow">REQUIREMENTS</div><h1>需求管理 <span class="heading-count">{{ items.paginator.count }}</span></h1><p>从提出到结项，每个环节都有清晰的责任与记录。</p></div><a class="button" href="{% url 'requirement_create' %}">＋ 新建需求</a></div><section class="panel"><form class="filters" method="get"><input name="q" placeholder="搜索需求标题、编号或正文" value="{{ request.GET.q }}"><select name="project"><option value="">全部项目</option>{% for p in nav_projects %}<option value="{{ p.pk }}" {% if request.GET.project == p.pk|stringformat:'s' %}selected{% endif %}>{{ p.name }}</option>{% endfor %}</select><select name="stage"><option value="">全部环节</option>{% for key,label in stages %}<option value="{{ key }}" {% if request.GET.stage == key %}selected{% endif %}>{{ label }}</option>{% endfor %}</select><select name="owner"><option value="">全部负责人</option>{% for p in people %}<option value="{{ p.pk }}" {% if request.GET.owner == p.pk|stringformat:'s' %}selected{% endif %}>{{ p.get_full_name|default:p.username }}</option>{% endfor %}</select><select name="priority"><option value="">全部优先级</option>{% for key,label in priorities %}<option value="{{ key }}" {% if request.GET.priority == key %}selected{% endif %}>{{ label }}</option>{% endfor %}</select><label>更新起始 <input type="date" name="start" value="{{ request.GET.start }}"></label><label>更新截止 <input type="date" name="end" value="{{ request.GET.end }}"></label><button class="button">筛选</button><a class="button secondary" href="{% url 'requirements' %}">重置</a></form>{% include 'tracker/requirement_table.html' with requirements=items %}{% include 'tracker/pagination.html' %}</section>{% endblock %}

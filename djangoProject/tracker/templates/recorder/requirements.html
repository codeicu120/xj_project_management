{% extends 'recorder/base.html' %}{% block content %}<div class="page-heading"><div><h1>需求管理</h1><p>一条需求，一份完整档案。记录线下进展与每一次聊天确认。</p></div>{% if can_write %}<a href="{% url 'requirement_create' %}" class="button">＋ 登记新需求</a>{% endif %}</div><section class="panel"><form class="filters"><input type="hidden" name="project" value="{{ selected_project }}"><input name="q" placeholder="搜索需求名称、编号或责任人" value="{{ request.GET.q }}"><select name="stage"><option value="">全部环节</option>{% for key,label in stages %}<option value="{{ key }}" {% if request.GET.stage == key %}selected{% endif %}>{{ label }}</option>{% endfor %}</select><button class="button secondary">搜索</button></form>{% include 'recorder/req_table.html' %}<div class="pagination">共 {{ items|length }} 条记录<span>业务人员均无需登录</span></div></section>{% endblock %}
